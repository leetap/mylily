# Uncomment the following line to enable deep sleep
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=200000

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=n
CONFIG_BT_CTLR_PHY_2M=n

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=0
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=n

# Custom animation speed, uncomment if turning animation on
CONFIG_CUSTOM_ANIMATION_SPEED=1800000

# Enable mouse buttons
CONFIG_ZMK_POINTING=y


# --- Underglow (WS2812/SK6812 type) ---
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# If your WS2812 driver is the SPI variant (recommended on nRF52):
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

